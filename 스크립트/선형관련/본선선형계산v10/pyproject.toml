[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

# ============================================================
# 프로젝트 메타데이터 (PEP 621)
# ============================================================
[project]
name = "railway-alignment"
version = "10.0.0"
description = "철도 평면선형 계산 및 DXF/Excel 출력 도구"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" },
]
keywords = ["railway", "alignment", "civil", "dxf", "cad", "선형", "철도"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Engineering",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "shapely>=2.0",
    "ezdxf>=1.1",
    "openpyxl>=3.1",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "xlwt>=1.3",
]

# ============================================================
# 선택적 의존성
# ============================================================
[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.11",
    "pytest-xdist>=3.3",
    "ruff>=0.4",
    "mypy>=1.8",
    "build>=1.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

# ============================================================
# CLI 진입점
# ============================================================
[project.scripts]
railway-alignment = "railway_alignment.cli:main_gui"
railway-alignment-cli = "railway_alignment.cli:main_cli"

# ============================================================
# URL
# ============================================================
[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/railway-alignment"
Documentation = "https://github.com/YOUR_USERNAME/railway-alignment#readme"
Repository = "https://github.com/YOUR_USERNAME/railway-alignment"
Issues = "https://github.com/YOUR_USERNAME/railway-alignment/issues"
Changelog = "https://github.com/YOUR_USERNAME/railway-alignment/blob/main/CHANGELOG.md"

# ============================================================
# Hatchling 빌드 설정 (src 레이아웃)
# ============================================================
[tool.hatch.build.targets.wheel]
packages = ["src/railway_alignment"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

# ============================================================
# pytest
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=railway_alignment",
    "--cov-report=term-missing",
    "--cov-report=html:tests/coverage_html",
    "--cov-fail-under=70",
]
markers = [
    "slow: 느린 테스트 (통합/e2e)",
    "regression: v9 회귀 비교",
    "requires_dxf: ezdxf 필요",
]

# ============================================================
# Coverage
# ============================================================
[tool.coverage.run]
source = ["railway_alignment"]
omit = [
    "*/gui/*",           # GUI는 별도 검증
    "*/__main__.py",
    "*/cli.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ============================================================
# Ruff (lint + format)
# ============================================================
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
]
ignore = [
    "E501",   # line-length는 formatter가 처리
    "N803",   # 케이스 (W13, H20 등 원본 수식 변수명 유지)
    "N806",
]

[tool.ruff.lint.isort]
known-first-party = ["railway_alignment"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================
# mypy
# ============================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false     # 점진적 강화
ignore_missing_imports = true
files = ["src/railway_alignment"]

[[tool.mypy.overrides]]
module = [
    "ezdxf.*",
    "shapely.*",
    "xlwt.*",
    "matplotlib.*",
]
ignore_missing_imports = true